web_source_url: "https://data.vlaanderen.be/standaarden/"

graphDB_host: "http://localhost:7200"
graphDB_config_file_path: "config_graphDB_repo.ttl"
graphDB_source_repo_name: "oslo"
graphDB_target_repo_name: "srm"

validator:
  url: "http://localhost:8080/shacl/srm/api/validate"

  payload:
    validationType: "v3.0.0"
    contentSyntax: "text/turtle"
    contentToValidate: "__CONTENT__"

  headers:
    Accept: "application/ld+json"
    Content-Type: "application/json"
    
extract_query: |
    PREFIX dct: <http://purl.org/dc/terms/>
    SELECT ?s ?o
    WHERE {
    { ?s dct:type <https://data.vlaanderen.be/id/concept/StandaardType/Applicatieprofiel> }
    UNION
    { ?s dct:type <https://data.vlaanderen.be/id/concept/StandaardType/Vocabularium> }
    }
    

construct_query: |
    PREFIX dct: <http://purl.org/dc/terms/>
    PREFIX adms: <http://www.w3.org/ns/adms#>
    CONSTRUCT {
    ?s ?p ?o .
    } 
    WHERE {
    ?s ?p ?o .
    FILTER(?s = <$uri>)
    }