services:
  neo4j:
    image: neo4j:5.26-community
    container_name: SR-GraphRAG-neo4j-kg
    ports:
      - "7555:7474"
      - "7688:7687"
    volumes:
      - sr_neo4j_data:/data
      - sr_neo4j_logs:/logs
      - ./data:/var/lib/neo4j/import
      - sr_neo4j_plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
      - NEO4J_PLUGINS=["apoc", "n10s"]
      - NEO4J_db_tx__log_rotation_retention__policy=1 files
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  chatbot:
    image: ${CHATBOT_IMAGE:-sr-graphrag-chatbot:latest}
    container_name: SR-GraphRAG-chatbot
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8050:8050"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password
      - PWC_API_KEY=${PWC_API_KEY}
      - PWC_URL=${PWC_URL}
      - LLM_MODEL_OPUS=${LLM_MODEL_OPUS}
      - LLM_MODEL_GPT_MINI=${LLM_MODEL_GPT_MINI}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - NEO4J_TTL_FILES=${NEO4J_TTL_FILES:-data_SRM.ttl,enriched_SRM.ttl}
    restart: unless-stopped

  semantic-registry:
    build: .
    depends_on:
      - chatbot
    ports:
      - "8080:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - BASE_PATH=/semantic-registry
      - CHATBOT_INTERNAL_URL=http://chatbot:8050
    restart: unless-stopped

volumes:
  sr_neo4j_data:
  sr_neo4j_logs:
  sr_neo4j_plugins: