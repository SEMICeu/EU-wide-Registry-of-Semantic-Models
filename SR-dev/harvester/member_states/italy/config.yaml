web_source_url: "https://schema.gov.it/sparql?default-graph-uri="
web_source_query_url: "https://schema.gov.it/sparql?default-graph-uri=&query="
format_params: "&format=text%2Fcsv&timeout=0&signal_void=on"

enable_provenance_history: True
keep_latest_entries_provenance: 2

fetch_query: | 
  PREFIX dct: <http://purl.org/dc/terms/>
  PREFIX owl: <http://www.w3.org/2002/07/owl#>
  select ?s ?issued ?modified
  where {
    ?s rdf:type owl:Ontology .
    ?s dct:issued ?issued .
    OPTIONAL {
      ?s dct:modified ?modified
    }
  }   

graphDB_host: "http://localhost:7200"
graphDB_config_file_path: "config_graphDB_repo.ttl"
graphDB_source_repo_name: "italy"
graphDB_target_repo_name: "srm"
graphDB_provenance_repo_name: "italy_prov"

transformation:
  namespaces:
    adms: "http://www.w3.org/ns/adms#"
    admsapit: "https://w3id.org/italia/onto/ADMS/"
    dct: "http://purl.org/dc/terms/"
    dcat: "http://www.w3.org/ns/dcat#"
    vann: "http://purl.org/vocab/vann/"
    foaf: "http://xmlns.com/foaf/0.1/"
    skos: "http://www.w3.org/2004/02/skos/core#"
    schema: "http://schema.org/"
    vcard: "http://www.w3.org/2006/vcard/ns#"
    m8g: "http://data.europa.eu/m8g/"
    org: "http://www.w3.org/ns/org#"
    prof: "http://www.w3.org/ns/dx/prof/"
    owl: "http://www.w3.org/2002/07/owl#"
    rdfs: "http://www.w3.org/2000/01/rdf-schema#"

validator:
  url: "http://localhost:8080/shacl/srm/api/validate"

  payload:
    validationType: "v1.0.1"
    contentSyntax: "text/turtle"
    contentToValidate: "__CONTENT__"

  headers:
    Accept: "application/ld+json"
    Content-Type: "application/json"

extract_query: |
    PREFIX dct: <http://purl.org/dc/terms/>
    SELECT ?s
    WHERE {
      { ?s dct:type <https://data.vlaanderen.be/id/concept/StandaardType/Applicatieprofiel> }
      UNION
      { ?s dct:type <https://data.vlaanderen.be/id/concept/StandaardType/Vocabularium> }
    } LIMIT 5


construct_query: |
    CONSTRUCT {
      ?s ?p ?o .
    } 
    WHERE {
      ?s ?p ?o .
      FILTER(?s = <$uri>)
    }

construct_custom_query: |
    CONSTRUCT {
      ?s ?p ?o .
    } 
    WHERE {
      ?s ?p ?o .
      FILTER(?s = <$uri>)
      FILTER(?p = <$property>)
    }
  
select_last_provenance_date_query: |
    PREFIX prov: <http://www.w3.org/ns/prov#>
    SELECT ?endTime
    WHERE {
      ?execution prov:endedAtTime ?endTime .
    }
    ORDER BY DESC(?endTime)
    LIMIT 1

delete_old_entries_provenance_query: |
    PREFIX prov: <http://www.w3.org/ns/prov#>

    DELETE {
      ?s ?p ?o .
    }
    WHERE {
      ?s ?p ?o .
      
      MINUS {
        SELECT ?s
        WHERE {
          ?s prov:endedAtTime ?endTime .
        }
        ORDER BY DESC(?endTime)
        LIMIT $keep_latest
      }
    }